services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: f1rag
      POSTGRES_PASSWORD: f1rag
      POSTGRES_DB: f1rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1rag -d f1rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: